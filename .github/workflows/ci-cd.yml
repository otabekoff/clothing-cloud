# ════════════════════════════════════════════════════════════════
#  CI/CD pipeline (criterion: "Practically implement a CI/CD automation
#  pipeline"). Targets AWS: Amazon ECR for images, an EC2 instance running
#  Docker Compose for the deployment. Three gated stages:
#
#    test    → backend unit tests + frontend build (quality gate)
#    build   → build & push backend/frontend/lb images to Amazon ECR
#    deploy  → SSH to the EC2 instance, pull images, recreate the stack,
#              run a post-deploy smoke test
#
#  Required repository secrets (Settings → Secrets and variables → Actions):
#    AWS_ACCESS_KEY_ID       IAM user/key allowed to push to ECR
#    AWS_SECRET_ACCESS_KEY   matching secret
#    AWS_REGION              e.g. eu-central-1
#    AWS_ACCOUNT_ID          12-digit account id (used to build the ECR URL)
#    EC2_HOST                EC2 public IP or DNS name
#    EC2_USER                ssh user (ec2-user on Amazon Linux, ubuntu on Ubuntu)
#    EC2_SSH_KEY             private key for that user
#
#  See docs/aws-deploy.md for the one-time console + CLI setup.
# ════════════════════════════════════════════════════════════════
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint backend (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (type/asset check)
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images
        env:
          SHA: ${{ github.sha }}
        run: |
          # repo dir → ECR repo name (nginx image is published as "lb")
          for svc in backend frontend nginx; do
            name=$svc; [ "$svc" = "nginx" ] && name=lb
            repo="$ECR_REGISTRY/nimbus/$name"
            docker build -t "$repo:$SHA" -t "$repo:latest" "./$svc"
            docker push "$repo:$SHA"
            docker push "$repo:latest"
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Copy compose + scripts to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/smoke-test.sh"
          target: "~/nimbus"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID
          script: |
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
            export ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
            cd ~/nimbus
            # Ensure required env exists. JWT_SECRET is mandatory for the app;
            # generate a strong one on first deploy if the instance lacks it so
            # existing boxes upgrade cleanly instead of failing the compose step.
            touch .env
            grep -q '^JWT_SECRET=' .env || \
              echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> .env
            # Authenticate Docker to ECR using the instance's IAM role
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            # ECR_REGISTRY is consumed by docker-compose.prod.yml
            echo "ECR_REGISTRY=$ECR_REGISTRY" > .deploy.env
            ECR_REGISTRY=$ECR_REGISTRY docker compose -f docker-compose.prod.yml pull
            # Stop the old stack first so published ports (80/8080) are released
            # cleanly. The pgdata volume is named, so DB data persists.
            ECR_REGISTRY=$ECR_REGISTRY docker compose -f docker-compose.prod.yml down --remove-orphans || true
            # Free ports 80/8080 no matter what holds them. `compose down` only
            # covers this project; a container from an old project name — or a
            # host service (httpd/nginx) installed directly — can still hold the
            # port. Diagnose, then remove the offending container(s) and stop any
            # host web server so the new lb/frontend can bind.
            echo "--- who holds :80 / :8080 ---"
            sudo ss -ltnp '( sport = :80 or sport = :8080 )' 2>/dev/null || true
            for c in $(docker ps -aq); do
              if docker port "$c" 2>/dev/null | grep -qE ':80$|:8080$|0\.0\.0\.0:(80|8080)->'; then
                echo "removing container $c (publishes 80/8080):"; docker rm -f "$c" || true
              fi
            done
            for svc in httpd nginx apache2; do
              sudo systemctl stop "$svc" 2>/dev/null && sudo systemctl disable "$svc" 2>/dev/null || true
            done
            ECR_REGISTRY=$ECR_REGISTRY docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            chmod +x scripts/smoke-test.sh
            sleep 10
            ./scripts/smoke-test.sh http://localhost http://localhost:8080
