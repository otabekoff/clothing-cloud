# Serves the built SPA and forwards API traffic to the backend load balancer.
# In the compose topology this container sits in the PUBLIC subnet; the backend
# LB target resolves only on the PRIVATE network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache, SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + ops endpoints proxied to the internal load balancer
    location ~ ^/(api|whoami|health|metrics) {
        proxy_pass http://lb:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
