# ── Internal load balancer (Layer 7) ─────────────────────────────
# Distributes ERP/CRM/WMS API traffic across every running FastAPI replica.
#
# Open-source Nginx cannot use the Plus-only `resolve` flag on an upstream
# server, so we re-resolve the Docker service name on each request using a
# variable in proxy_pass together with Docker's embedded DNS (127.0.0.11).
# Docker returns the live set of replica IPs in round-robin order, so replicas
# added by `docker compose up --scale backend=N` (or the auto-scaler) start
# receiving traffic within `valid=5s` — no Nginx reload needed. THIS is what
# makes the load-balancing / auto-scaling demo update live on screen.

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;

    # Health probe for the LB itself
    location = /lb-health {
        return 200 "lb ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        # `backend` resolves to ALL replica IPs; the variable forces per-request
        # re-resolution so newly scaled replicas join the rotation automatically.
        set $pool backend;
        proxy_pass http://$pool:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fail fast and retry the next replica if one is busy or still warming up
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
