# Ruff handles both linting and formatting for the backend (one fast tool).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "W", "F", "I", "B", "UP"]
# B008: `Depends(...)` in argument defaults is the canonical FastAPI idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately patch modules before importing the app under test.
"tests/*" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
